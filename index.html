<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Алдон: Путь в Нячанг (Birthday Quest)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #3b82f6;
            --neon-red: #ef4444;
            --neon-green: #10b981;
            --neon-yellow: #f59e0b;
        }
        body {
            font-family: 'Rubik', sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            overflow-x: hidden;
            user-select: none;
            touch-action: manipulation;
        }
        .pixel-font { font-family: 'Press Start 2P', monospace; }
        
        /* Glassmorphism & Neon Effects */
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .neon-border-blue { box-shadow: 0 0 10px var(--neon-blue), inset 0 0 10px rgba(59, 130, 246, 0.2); border-color: var(--neon-blue); }
        .neon-border-red { box-shadow: 0 0 10px var(--neon-red), inset 0 0 10px rgba(239, 68, 68, 0.2); border-color: var(--neon-red); }
        .neon-text-yellow { text-shadow: 0 0 8px rgba(245, 158, 11, 0.8); }
        
        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-3px, 2px) rotate(-1deg); }
            40% { transform: translate(3px, -2px) rotate(1deg); }
            60% { transform: translate(-3px, -2px) rotate(-1deg); }
            80% { transform: translate(3px, 2px) rotate(1deg); }
        }
        .shaking { animation: shake 0.3s ease-in-out; }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.8); }
        }
        .btn-glow:hover { animation: pulse-glow 1.5s infinite; }

        /* Speech Bubble Arrow */
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 20px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: rgba(30, 41, 59, 0.95) transparent;
            display: block;
            width: 0;
        }

        /* Responsive Canvas Container */
        #gameWrapper {
            width: 100%;
            max-width: 1180px;
            aspect-ratio: 16 / 10;
            position: relative;
            min-height: min(680px, calc(100vh - 110px));
            overflow: hidden;
        }
        #uiOverlay {
            position: absolute;
            inset: 0;
            z-index: 30;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            overflow-x: hidden;
            overflow-y: hidden;
            -webkit-overflow-scrolling: auto;
            overscroll-behavior: none;
        }
        #uiOverlay > * { flex-shrink: 0; }

        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 1rem;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }

        .lvl2-panel { position: absolute; left: 12px; right: auto; bottom: 12px; width: 61%; }
        @media (max-width: 760px) {
            .lvl2-panel { width: 68%; }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 sm:p-4">

    <!-- Header -->
    <header class="w-full max-w-[900px] flex justify-between items-center mb-4 glass-panel p-3 sm:p-4 rounded-xl z-40">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-br from-yellow-400 to-orange-500 p-2 rounded-lg shadow-lg">
                <span class="text-xl sm:text-2xl drop-shadow-md">🎂</span>
            </div>
            <h1 class="font-black text-[10px] sm:text-sm text-yellow-400 pixel-font neon-text-yellow leading-tight">АЛДОН:<br>ПУТЬ В НЯЧАНГ</h1>
        </div>
        <button id="soundToggleBtn" onclick="toggleAudio()" class="px-4 py-2 bg-slate-800/80 hover:bg-slate-700 rounded-lg flex items-center gap-2 border border-slate-600 shadow-md transition-all">
            <span id="soundIcon" class="text-lg">🔊</span> <span id="soundText" class="text-xs sm:text-sm font-bold">ВКЛ</span>
        </button>
    </header>

    <!-- Game Wrapper -->
    <main id="gameWrapper" class="glass-panel rounded-2xl shadow-[0_0_40px_rgba(0,0,0,0.5)] border-2 border-slate-700/50 overflow-hidden flex flex-col">
        
        <!-- HUD Overlay -->
        <div id="hudOverlay" class="hidden absolute top-0 left-0 right-0 z-20 flex justify-between items-start p-3 sm:p-4 pointer-events-none">
            <div class="flex flex-col gap-2">
                <div class="glass-panel px-3 py-1.5 rounded-lg border-l-4 border-l-blue-500">
                    <span id="hudLevelName" class="font-bold text-white text-xs sm:text-sm tracking-wide">Уровень 1</span>
                </div>
                <div class="glass-panel px-3 py-1.5 rounded-lg border-l-4 border-l-yellow-400 flex items-center gap-2">
                    <span class="text-[10px] text-slate-300 uppercase">Очки</span>
                    <span id="hudScore" class="font-bold text-yellow-400 text-sm sm:text-base pixel-font neon-text-yellow">0</span>
                </div>
            </div>
            
            <div id="hpContainer" class="glass-panel px-3 py-2 rounded-lg border-l-4 border-l-green-500 flex flex-col gap-1 items-end min-w-[120px]">
                <span class="text-[10px] text-slate-300 uppercase font-bold">Здоровье</span>
                <div class="w-full bg-slate-900 h-3 rounded-full overflow-hidden shadow-inner border border-slate-700">
                    <div id="hpBar" class="bg-gradient-to-r from-emerald-400 to-emerald-500 h-full w-full transition-all duration-300 ease-out shadow-[0_0_10px_rgba(16,185,129,0.8)]"></div>
                </div>
            </div>
        </div>

        <!-- The Canvas -->
        <canvas id="gameCanvas" width="900" height="562"></canvas>

        <!-- UI Screen Overlay -->
        <div id="uiOverlay" class="absolute inset-0 z-30 flex flex-col items-center justify-center p-4 sm:p-6 bg-slate-950/80 backdrop-blur-sm transition-opacity duration-300">
            <!-- Screen content injected via JS -->
        </div>
    </main>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiOverlay = document.getElementById('uiOverlay');
        const hudOverlay = document.getElementById('hudOverlay');
        const hpContainer = document.getElementById('hpContainer');

        // ============================================================
        // AUDIO CONFIG — edit volumes here, in one place.
        // ============================================================
        const AUDIO_VOLUME = {
            bgm: {
                menu: 0.28,
                lvl1: 0.34,
                lvl2: 0.30,
                flight: 0.48,
                lvl3: 0.34,
                lvl4: 0.34,
            },
            sfx: {
                droneExplode: 0.78,
                lvl1Fail: 0.90,
                denied: 0.90,
                wrong: 0.72,
                foodCatch: 0.34,
                kumis: 0.43,
                lvl3Fail: 0.50,
                banhBao: 0.88,
                scooterCrash: 0.50,
                lvl4Fail: 0.95,
                victory: 0.88,
                gasolinePickup: 1.0,
            },
            tts: 0.95,
            engine: 0.48,
            engineFallback: 0.035,
        };

        // Extra gain lets individual effects exceed the normal HTMLAudio volume=1 ceiling.
        const AUDIO_GAIN = {
            sfx: {
                gasolinePickup: 4.0
            }
        };

        const GAME_AUDIO = {
            bgm: {
                menu: './audio/Main_Menu_BG.mp3',
                lvl1: './audio/Lvl1_BGM.mp3',
                lvl2: './audio/Lvl2_BGM.mp3',
                lvl3: './audio/Lvl3_BGM.mp3',
                lvl4: './audio/Lvl4_BGM.mp3',
                flight: './audio/Flight_Song.mp3'
            },
            sfx: {
                droneExplode: './audio/Drone_Explode.mp3',
                lvl1Fail: './audio/Lvl1_Fail.mp3',
                denied: './audio/Stamp_Denied.mp3',
                wrong: './audio/Buzzer_Wrong.mp3',
                foodCatch: './audio/Food_Catch.mp3',
                kumis: './audio/Kumis_Ah.mp3',
                lvl3Fail: './audio/Lvl3_Fail.mp3',
                banhBao: './audio/BanhBao_Voice.mp3',
                scooterCrash: './audio/Scooter_Crash.mp3',
                lvl4Fail: './audio/Lvl4_Fail.mp3',
                victory: './audio/Victory_Jingle.mp3',
                // Optional custom gas-canister pickup sound. Safe to leave missing.
                gasolinePickup: './audio/Gasoline_Pickup.mp3'
            },
            engine: './audio/Kalina_Engine.mp3'
        };

        // Put your MP3s in ./audio/. In particular, add ./audio/Kalina_Engine.mp3 for the Lada engine.
        // Missing / broken files never stop the game. Each sound has a defined fallback.
        let soundEnabled = true;
        const audioCache = new Map();
        const audioFailed = new Set();
        let currentBGM = null;
        let currentBGMName = null;
        let fallbackBgmNodes = [];
        let audioContext = null;
        const activeOneShotAudios = new Set();
        const pendingOneShotRequests = [];
        const boostedGasNodes = new Set();

        let engineAudio = null;
        let engineOsc = null;
        let engineOsc2 = null;
        let engineGain = null;
        let engineUsingSynth = false;

        function initAudioContext() {
            try {
                if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
                if (audioContext.state === 'suspended') audioContext.resume().catch(() => {});
                return audioContext;
            } catch (e) {
                return null;
            }
        }

        function getAudio(src, loop = false, volume = 1) {
            if (!src || audioFailed.has(src)) return null;
            if (!audioCache.has(src)) {
                const a = new Audio();
                a.preload = 'auto';
                a.src = src;
                a.loop = loop;
                a.volume = Math.max(0, Math.min(1, volume));
                a.addEventListener('error', () => audioFailed.add(src), { once: true });
                a.load();
                audioCache.set(src, a);
            }
            const a = audioCache.get(src);
            a.loop = loop;
            a.volume = Math.max(0, Math.min(1, volume));
            return a;
        }

        function makeOneShotAudio(src, volume, gainMultiplier = 1) {
            if (!src || audioFailed.has(src)) return null;
            const a = new Audio();
            a.preload = 'auto';
            a.src = src;
            // Keep normal SFX on the native media path. The previous version routed every
            // effect through MediaElementSource -> AudioContext; a suspended AudioContext
            // made the MP3 itself effectively silent even though play() succeeded.
            a.volume = Math.max(0, Math.min(1, volume));
            activeOneShotAudios.add(a);
            const cleanup = () => {
                activeOneShotAudios.delete(a);
                a.removeEventListener('ended', cleanup);
                a.removeEventListener('error', cleanup);
            };
            a.addEventListener('ended', cleanup);
            a.addEventListener('error', () => {
                audioFailed.add(src);
                cleanup();
            }, { once: true });
            return a;
        }

        function stopAllOneShotAudio() {
            pendingOneShotRequests.length = 0;
            activeOneShotAudios.forEach(a => {
                try { a.pause(); a.currentTime = 0; } catch (e) {}
            });
            activeOneShotAudios.clear();
            boostedGasNodes.forEach(node => {
                try { node.audio.pause(); node.audio.currentTime = 0; } catch (e) {}
                try { node.source.disconnect(); } catch (e) {}
                try { node.gain.disconnect(); } catch (e) {}
            });
            boostedGasNodes.clear();
            if ('speechSynthesis' in window) {
                try { window.speechSynthesis.cancel(); } catch (e) {}
            }
        }

        function queueOneShotRetry(name, ttsText = null) {
            const existing = pendingOneShotRequests.find(r => r.name === name);
            if (!existing) pendingOneShotRequests.push({ name, ttsText });
        }

        function retryPendingOneShots() {
            if (!soundEnabled || !pendingOneShotRequests.length) return;
            const pending = pendingOneShotRequests.splice(0, pendingOneShotRequests.length);
            pending.forEach(req => {
                const played = playCustomSfx(req.name);
                if (!played && req.ttsText) playVoiceLine(req.ttsText);
            });
        }

        function playCustomSfx(name, ttsText = null, ttsRate = 0.88) {
            if (!soundEnabled) return false;
            const src = GAME_AUDIO.sfx[name];
            if (!src || audioFailed.has(src)) {
                if (ttsText) playVoiceLine(ttsText, 0, ttsRate);
                return false;
            }
            const volume = AUDIO_VOLUME.sfx[name] ?? 0.8;
            const a = makeOneShotAudio(src, volume);
            if (!a) return false;
            try {
                const result = a.play();
                if (result && typeof result.catch === 'function') {
                    result.catch((err) => {
                        activeOneShotAudios.delete(a);
                        if (err?.name === 'NotAllowedError') queueOneShotRetry(name, ttsText);
                    });
                }
                return true;
            } catch (e) {
                activeOneShotAudios.delete(a);
                queueOneShotRetry(name, ttsText);
                return false;
            }
        }

        function playGasolinePickup() {
            // Simple native MP3 path, same as the other one-shot effects. No layered copies,
            // no WebAudio gain stage. The user explicitly preferred the old lightweight path.
            if (playCustomSfx('gasolinePickup')) return true;
            if (!soundEnabled) return false;
            const ctx = initAudioContext();
            if (!ctx) return false;
            try {
                const now = ctx.currentTime;
                const master = ctx.createGain();
                master.gain.setValueAtTime(0.0001, now);
                master.gain.exponentialRampToValueAtTime(0.24, now + 0.01);
                master.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
                master.connect(ctx.destination);
                [
                    { f: 330, t: 0.00, d: 0.10 },
                    { f: 494, t: 0.08, d: 0.12 },
                    { f: 659, t: 0.16, d: 0.12 },
                ].forEach(({f,t,d}) => {
                    const o = ctx.createOscillator();
                    const g = ctx.createGain();
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(f, now + t);
                    g.gain.setValueAtTime(0.0001, now + t);
                    g.gain.exponentialRampToValueAtTime(0.65, now + t + 0.01);
                    g.gain.exponentialRampToValueAtTime(0.0001, now + t + d);
                    o.connect(g); g.connect(master);
                    o.start(now + t); o.stop(now + t + d + 0.02);
                });
                return true;
            } catch (e) { return false; }
        }

        function stopFallbackBgm() {
            fallbackBgmNodes.forEach(node => {
                try { node.stop(); } catch (e) {}
                try { node.disconnect(); } catch (e) {}
            });
            fallbackBgmNodes = [];
        }

        function startFallbackBgm(name) {
            if (!soundEnabled) return;
            const ctx = initAudioContext();
            if (!ctx || fallbackBgmNodes.length) return;

            const bases = { menu: 110, lvl1: 82, lvl2: 98, flight: 65, lvl3: 123, lvl4: 73 };
            const base = bases[name] || 90;

            try {
                const master = ctx.createGain();
                master.gain.value = (AUDIO_VOLUME.bgm[name] ?? 0.25) * 0.18;
                master.connect(ctx.destination);

                const o1 = ctx.createOscillator();
                const o2 = ctx.createOscillator();
                o1.type = 'triangle';
                o2.type = 'sine';
                o1.frequency.value = base;
                o2.frequency.value = base * 1.5;
                o1.connect(master); o2.connect(master);
                o1.start(); o2.start();
                fallbackBgmNodes = [o1, o2, master];
            } catch (e) {}
        }

        function playBGM(name) {
            currentBGMName = name;
            stopBGM(false);
            if (!soundEnabled) return false;

            const src = GAME_AUDIO.bgm[name];
            if (!src || audioFailed.has(src)) return false;

            try {
                const a = getAudio(src, true, AUDIO_VOLUME.bgm[name] ?? 0.3);
                if (!a) return false;
                currentBGM = a;
                const result = a.play();
                if (result && typeof result.catch === 'function') {
                    result.catch(() => {
                        // Crucial: do NOT mark the MP3 as failed here.
                        // Most first-play rejections are autoplay policy, not a bad file.
                    });
                }
                return true;
            } catch (e) {
                return false;
            }
        }

        function stopBGM(clearSelection = false) {
            if (currentBGM) {
                try { currentBGM.pause(); currentBGM.currentTime = 0; } catch (e) {}
            }
            currentBGM = null;
            stopFallbackBgm();
            if (clearSelection) currentBGMName = null;
        }

        function retryCurrentBGM() {
            if (!soundEnabled || !currentBGMName) return;
            const desiredName = currentBGMName;
            if (currentBGM) {
                try {
                    const r = currentBGM.play();
                    if (r?.catch) r.catch(() => {});
                } catch (e) {}
            } else {
                playBGM(desiredName);
            }
        }

        function playVoiceLine(text, delay = 0, rate = 0.88) {
            if (!soundEnabled || !('speechSynthesis' in window)) return false;
            const speak = () => {
                try {
                    const u = new SpeechSynthesisUtterance(text);
                    const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
                    const ruVoice = voices.find(v => /^ru/i.test(v.lang)) || voices.find(v => /ru/i.test(v.lang));
                    if (ruVoice) u.voice = ruVoice;
                    u.lang = 'ru-RU';
                    u.rate = rate;
                    u.pitch = 0.84;
                    u.volume = AUDIO_VOLUME.tts;
                    window.speechSynthesis.speak(u);
                    return true;
                } catch (e) {
                    return false;
                }
            };
            if (delay > 0) { setTimeout(speak, delay); return true; }
            return speak();
        }

        function startEngineSynth() {
            if (!soundEnabled || engineOsc || !initAudioContext()) return;
            try {
                const ctx = audioContext;
                engineGain = ctx.createGain();
                engineGain.gain.value = AUDIO_VOLUME.engineFallback;
                engineGain.connect(ctx.destination);

                engineOsc = ctx.createOscillator();
                engineOsc.type = 'sawtooth';
                engineOsc.frequency.value = 74;
                engineOsc.connect(engineGain);

                engineOsc2 = ctx.createOscillator();
                engineOsc2.type = 'square';
                engineOsc2.frequency.value = 37;
                engineOsc2.connect(engineGain);

                engineOsc.start();
                engineOsc2.start();
                engineUsingSynth = true;
            } catch (e) {
                engineOsc = engineOsc2 = engineGain = null;
            }
        }

        function startEngineSound() {
            if (!soundEnabled) return;
            stopEngineSound();

            const src = GAME_AUDIO.engine;
            if (src && !audioFailed.has(src)) {
                const a = getAudio(src, true, AUDIO_VOLUME.engine);
                if (a) {
                    engineAudio = a;
                    const result = a.play();
                    if (result && typeof result.catch === 'function') {
                        result.catch((err) => {
                            engineAudio = null;
                            // NotAllowedError means browser autoplay policy, not a missing file.
                            if (err?.name === 'NotAllowedError') return;
                        });
                    }
                    return;
                }
            }
            // Synth fallback is only for a genuinely missing/broken engine file.
            if (src && !audioFailed.has(src)) return;
            startEngineSynth();
        }

        function updateEngineSound() {
            if (!engineUsingSynth || !engineOsc || !audioContext || gameState !== 'LVL1') return;
            const rpm = 72 + lvl1Player.speed * 5 + Math.sin(performance.now() / 80) * 2;
            try {
                engineOsc.frequency.setTargetAtTime(rpm, audioContext.currentTime, 0.03);
                engineOsc2.frequency.setTargetAtTime(rpm / 2, audioContext.currentTime, 0.03);
            } catch (e) {}
        }

        function stopEngineSound() {
            if (engineAudio) {
                try { engineAudio.pause(); engineAudio.currentTime = 0; } catch (e) {}
                engineAudio = null;
            }
            [engineOsc, engineOsc2].forEach(o => {
                try { if (o) o.stop(); } catch (e) {}
                try { if (o) o.disconnect(); } catch (e) {}
            });
            try { if (engineGain) engineGain.disconnect(); } catch (e) {}
            engineOsc = engineOsc2 = engineGain = null;
            engineUsingSynth = false;
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundIcon').innerText = soundEnabled ? '🔊' : '🔇';
            document.getElementById('soundText').innerText = soundEnabled ? 'ВКЛ' : 'ВЫКЛ';

            if (!soundEnabled) {
                if (currentBGM) { try { currentBGM.pause(); } catch (e) {} }
                stopFallbackBgm();
                if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
                stopEngineSound();
                return;
            }

            initAudioContext();
            retryPendingOneShots();
            if (gameState === 'MENU' || gameState === 'LVL1' || gameState === 'LVL2' || gameState === 'CUTSCENE' || gameState === 'LVL3' || gameState === 'LVL4') retryCurrentBGM();
            if (gameState === 'LVL1') startEngineSound();
        }

        // Browser autoplay policies block audible playback until the first user gesture.
        // We catch that first gesture and immediately retry the currently selected BGM.
        function primeAudioFromUserGesture() {
            initAudioContext();
            retryPendingOneShots();
            if (gameState === 'MENU') playBGM('menu');
            else retryCurrentBGM();
            if (gameState === 'LVL1' && !engineAudio && !engineOsc) startEngineSound();
        }

        function playSynthSound(type) {
            if (!soundEnabled) return;
            const ctx = initAudioContext();
            if (!ctx) return;
            try {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                const now = ctx.currentTime;
                if (type === 'hit') {
                    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
                    gain.gain.setValueAtTime(0.34, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'eat') {
                    osc.type = 'sine'; osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.25, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                } else if (type === 'denied') {
                    osc.type = 'square'; osc.frequency.setValueAtTime(100, now); osc.frequency.setValueAtTime(70, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now); osc.stop(now + 0.5);
                } else if (type === 'gasoline') {
                    osc.type = 'triangle'; osc.frequency.setValueAtTime(220, now); osc.frequency.exponentialRampToValueAtTime(90, now + 0.08);
                    gain.gain.setValueAtTime(0.12, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.12);

        // Particle System + Impact FX
        let particles = [];
        let explosionEffects = [];
        function spawnParticles(x, y, color, count, speed = 2, size = 4) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * speed * 2,
                    vy: (Math.random() - 0.5) * speed * 2,
                    life: 1.0, color: color, size: size + Math.random()*2
                });
            }
        }
        function spawnExplosion(x, y, strength = 1) {
            explosionEffects.push({ x, y, age: 0, life: 28, strength });
            const sparks = Math.round(18 + 18 * strength);
            for (let i = 0; i < sparks; i++) {
                const a = Math.random() * Math.PI * 2;
                const speed = 3 + Math.random() * 6 * strength;
                particles.push({
                    x, y,
                    vx: Math.cos(a) * speed,
                    vy: Math.sin(a) * speed,
                    life: 0.7 + Math.random() * 0.4,
                    color: Math.random() < 0.55 ? '#fbbf24' : (Math.random() < 0.55 ? '#f97316' : '#dc2626'),
                    size: 2 + Math.random() * 5
                });
            }
        }

        function updateAndDrawExplosionEffects(c) {
            for (let i = explosionEffects.length - 1; i >= 0; i--) {
                const e = explosionEffects[i];
                e.age += 1;
                const t = e.age / e.life;
                if (t >= 1) { explosionEffects.splice(i, 1); continue; }

                c.save();
                c.globalCompositeOperation = 'lighter';
                const core = Math.max(0.01, 1 - t);
                const radius = (18 + 62 * Math.sin(Math.min(1, t) * Math.PI / 2)) * e.strength;

                // White-hot core -> yellow -> orange fireball.
                let g = c.createRadialGradient(e.x, e.y, 0, e.x, e.y, radius);
                g.addColorStop(0, `rgba(255,255,245,${0.95 * core})`);
                g.addColorStop(0.18, `rgba(255,235,120,${0.92 * core})`);
                g.addColorStop(0.48, `rgba(255,120,10,${0.78 * core})`);
                g.addColorStop(0.78, `rgba(220,38,38,${0.45 * core})`);
                g.addColorStop(1, 'rgba(80,10,10,0)');
                c.fillStyle = g;
                c.beginPath(); c.arc(e.x, e.y, radius, 0, Math.PI * 2); c.fill();

                // Jagged flame tongues.
                for (let k = 0; k < 9; k++) {
                    const ang = (Math.PI * 2 * k / 9) + e.age * 0.09;
                    const len = (14 + Math.random() * 22) * e.strength * core;
                    const bx = e.x + Math.cos(ang) * radius * 0.55;
                    const by = e.y + Math.sin(ang) * radius * 0.55;
                    c.fillStyle = k % 2 ? `rgba(249,115,22,${0.7 * core})` : `rgba(251,191,36,${0.78 * core})`;
                    c.beginPath();
                    c.moveTo(bx, by);
                    c.lineTo(bx + Math.cos(ang - 0.35) * len, by + Math.sin(ang - 0.35) * len);
                    c.lineTo(bx + Math.cos(ang + 0.35) * len, by + Math.sin(ang + 0.35) * len);
                    c.closePath(); c.fill();
                }

                // Expanding shockwave ring.
                c.globalCompositeOperation = 'source-over';
                c.strokeStyle = `rgba(255,237,213,${0.8 * core})`;
                c.lineWidth = Math.max(2, 8 * core);
                c.beginPath(); c.arc(e.x, e.y, radius * 1.3, 0, Math.PI * 2); c.stroke();

                // Dark smoke cap after the flash.
                if (t > 0.28) {
                    const smokeAlpha = Math.min(0.38, (t - 0.28) * 0.55) * (1 - t);
                    c.fillStyle = `rgba(30,30,35,${smokeAlpha})`;
                    for (let k = 0; k < 6; k++) {
                        const sx = e.x + Math.sin(e.age * 0.18 + k) * 14 + (k - 2.5) * 8;
                        const sy = e.y - 18 - t * 35 - k * 4;
                        const sr = 7 + k * 2 + t * 8;
                        c.beginPath(); c.arc(sx, sy, sr, 0, Math.PI * 2); c.fill();
                    }
                }
                c.restore();
            }
        }

        function updateAndDrawParticles(c) {
            updateAndDrawExplosionEffects(c);
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.vy += 0.03;
                p.vx *= 0.992; p.vy *= 0.992;
                p.life -= 0.02;
                if(p.life <= 0) { particles.splice(i, 1); continue; }
                c.globalAlpha = p.life;
                c.fillStyle = p.color;
                c.beginPath(); c.arc(p.x, p.y, p.size, 0, Math.PI*2); c.fill();
            }
            c.globalAlpha = 1.0;
        }

        function runLevel1Loop() {
            if (gameState !== 'LVL1') return;
            lvl1Distance += 4;
            updateHUD('1. Трасса М-7', true);
            updateEngineSound();
            
            // Exhaust
            if (Math.random() < 0.7) spawnParticles(lvl1Player.x - 10, lvl1Player.y + 60, '#64748b', 1, 1, 5);

            // Movement
            if (keys.Left && lvl1Player.x > 200) lvl1Player.x -= lvl1Player.speed;
            if (keys.Right && lvl1Player.x < canvas.width - 200) lvl1Player.x += lvl1Player.speed;

            // Spawn Obstacles (Trucks & Drones)
            if (Math.random() < 0.033) {
                const type = Math.random() < 0.38 ? 'truck' : 'drone';
                lvl1Obstacles.push({
                    x: 220 + Math.random() * (canvas.width - 440),
                    y: -100, type: type, speed: type === 'drone' ? 8 : 2 + Math.random() * 2
                });
            }

            // Spawn Gas Canisters (A95)
            if (Math.random() < 0.02) {
                lvl1Items.push({ x: 220 + Math.random() * (canvas.width - 440), y: -50, speed: 4 });
            }

            // Process Obstacles
            for (let i = lvl1Obstacles.length - 1; i >= 0; i--) {
                let ob = lvl1Obstacles[i];
                ob.y += ob.speed;
                
                // Truck Smoke
                if (ob.type === 'truck' && Math.random() < 0.24) spawnParticles(ob.x, ob.y + 40, '#1e293b', 1, 1.1, 5);
                if (ob.type === 'drone' && Math.random() < 0.20) {
                    spawnParticles(ob.x - 22, ob.y + 8, '#64748b', 1, 0.8, 3.5);
                }

                let hitW = ob.type === 'truck' ? 50 : 60; // wider hitbox for wings
                let hitH = ob.type === 'truck' ? 100 : 30;

                if (Math.abs(ob.x - lvl1Player.x) < (hitW/2 + 35) && Math.abs(ob.y - lvl1Player.y) < (hitH/2 + 60)) {

                    {e:'🥟', pts:150, kind:'food'}, {e:'🥩', pts:200, kind:'food'}, {e:'🥛', pts:300, kind:'kumis'}
                ];
                const sel = types[Math.floor(Math.random() * types.length)];

                    window.__lastTaxiLine = lineIdx;
                    playVoiceLine(KZ_TAXI_LINES[lineIdx], 0, 1.15);
                    if (Math.random() < 0.65) {
                        let line2Idx = Math.floor(Math.random() * KZ_TAXI_LINES.length);

                        // speechSynthesis queues utterances; this intentionally keeps the second

                        playVoiceLine(KZ_TAXI_LINES[line2Idx], 60, 1.15);

            ctx.restore();

            // Draw food and caricature taxi drivers instead of taxi emojis.
            lvl3Items.forEach(it => {
                ctx.save(); ctx.translate(it.x, it.y);
                if (it.type.kind === 'taxi') {
                    drawKazakhTaxiDriver(ctx, 0, 0);
                } else {
                    ctx.font = '40px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.rotate(Math.sin(it.y / 30) * 0.2);
                    ctx.shadowColor = 'rgba(0,0,0,0.5)'; ctx.shadowBlur = 5; ctx.shadowOffsetY = 3;
                    ctx.fillText(it.type.e, 0, 0);
                }
                ctx.restore();
            });

            updateAndDrawParticles(ctx);
            animationFrameId = requestAnimationFrame(runLevel3Loop);
        }

        let lvl4Scooter = { x: 450, y: 400 };
        let lvl4NPCs = [];
        let lvl4Distance = 0;
        const LVL4_GOAL = 4650;

        function showLevel4Intro() {
            stopAllOneShotAudio();
            gameState = 'TRANSITION'; cancelAnimationFrame(animationFrameId);
            showUI(`
                <div class="text-center w-full max-w-lg glass-panel p-6 sm:p-8 rounded-3xl border border-yellow-500/50 neon-border-yellow">
                    <h2 class="text-2xl font-black text-yellow-400 mb-2 pixel-font">ФИНАЛ</h2>
                    <h3 class="text-lg font-bold text-white mb-4">Вьетнам: Трафик Нячанга</h3>
                    <p class="text-sm text-slate-300 mb-6">Последний рывок к Жонику! Выживи на арендованном байке. Берегись доставщиков и хаотичных маневров.</p>
                    <button onclick="startLevel4()" class="btn-glow w-full py-4 bg-gradient-to-r from-yellow-500 to-orange-500 text-slate-900 font-extrabold rounded-xl shadow-lg pixel-font uppercase">Погнали!</button>
                </div>
            `);
        }

        function startLevel4() {
            gameState = 'LVL4'; score += 500; hp = 100; lvl4Distance = 0;
            playBGM('lvl4');
            lvl4Scooter.x = canvas.width / 2; lvl4NPCs = []; particles = []; explosionEffects = [];
            updateHUD('4. Трафик Нячанга', true);
            hideUI(); runLevel4Loop();
        }

        function drawVietnamScooter(c, x, y, isPlayer, type, dir = 1) {
            c.save(); c.translate(x, y);
            c.shadowColor = 'rgba(0,0,0,0.35)'; c.shadowBlur = 8; c.shadowOffsetY = 6;
            const flip = dir < 0 ? -1 : 1;
            c.scale(1, flip);

            if (isPlayer) {
                c.fillStyle = '#dc2626'; c.beginPath(); c.roundRect(-16, -34, 32, 68, 10); c.fill();
                c.fillStyle = '#0f172a'; c.fillRect(-10, -47, 8, 16); c.fillRect(2, 31, 8, 16);
                c.fillStyle = '#111827'; c.fillRect(-25, -25, 50, 5);
                c.fillStyle = '#2563eb'; c.beginPath(); c.ellipse(0, -11, 15, 18, 0, 0, Math.PI*2); c.fill();
                c.fillStyle = '#1e1b18'; c.beginPath(); c.arc(0, -22, 11, 0, Math.PI*2); c.fill();
                c.fillStyle = '#b91c1c'; c.beginPath(); c.ellipse(0, 15, 17, 18, 0, 0, Math.PI*2); c.fill();
                c.fillStyle = '#f5c89c'; c.beginPath(); c.arc(0, 15, 13, 0, Math.PI*2); c.fill();
                c.fillStyle = 'rgba(255,255,255,0.7)'; c.beginPath(); c.ellipse(-4, 10, 5, 2, -Math.PI/4, 0, Math.PI*2); c.fill();
            } else if (type === 'grab') {
                c.fillStyle = '#16a34a'; c.beginPath(); c.roundRect(-13, -28, 26, 56, 9); c.fill();
                c.fillStyle = '#22c55e'; c.roundRect(-20, 3, 40, 25, 5); c.fill();
                c.fillStyle = '#111827'; c.fillRect(-8, -39, 16, 13);
                c.fillStyle = '#f0bf91'; c.beginPath(); c.arc(0, -15, 10, 0, Math.PI*2); c.fill();
                c.fillStyle = '#0b0f10'; c.beginPath(); c.arc(0, -21, 10, Math.PI, 0); c.fill();
            } else if (type === 'banhbao') {
                // Banh Bao vendor / cart.
                c.fillStyle = '#a16207'; c.fillRect(-20, 8, 40, 22);
                c.fillStyle = '#fef3c7'; c.beginPath(); c.arc(-10, -10, 11, 0, Math.PI * 2); c.arc(10, -10, 11, 0, Math.PI * 2); c.fill();
                c.fillStyle = '#f0bf91'; c.beginPath(); c.arc(0, -28, 11, 0, Math.PI * 2); c.fill();
                c.fillStyle = '#111827'; c.fillRect(-8, -31, 3, 2); c.fillRect(5, -31, 3, 2);
                c.fillStyle = '#ef4444'; c.fillRect(-24, -3, 48, 5);
            } else if (type === 'car') {
                c.fillStyle = '#e7e5e4'; c.beginPath(); c.roundRect(-22, -34, 44, 68, 8); c.fill();
                c.fillStyle = '#38bdf8'; c.fillRect(-17, -20, 34, 15); c.fillStyle = '#fbbf24'; c.fillRect(-14, 16, 28, 8);
                c.fillStyle = '#111827'; c.fillRect(-25, -26, 5, 15); c.fillRect(20, 12, 5, 15);
            } else {
                c.fillStyle = '#7c3aed'; c.beginPath(); c.roundRect(-13, -28, 26, 56, 9); c.fill();
                c.fillStyle = '#f0bf91'; c.beginPath(); c.arc(0, -15, 10, 0, Math.PI*2); c.fill();
                c.fillStyle = '#1e293b'; c.beginPath(); c.arc(0, -21, 11, Math.PI, 0); c.fill();
            }
            c.restore();
        }

        function runLevel4Loop() {
            if (gameState !== 'LVL4') return;
            lvl4Distance += 5; updateHUD('4. Трафик Нячанга', true);
            
            // Exhaust
            if (Math.random() < 0.6) spawnParticles(lvl4Scooter.x + 10, lvl4Scooter.y + 35, '#94a3b8', 1, 1, 4);

            // Movement (Road boundaries: 150 to canvas.width - 150)
            if (keys.Left && lvl4Scooter.x > 180) lvl4Scooter.x -= 8;
            if (keys.Right && lvl4Scooter.x < canvas.width - 180) lvl4Scooter.x += 8;

            // Dense but readable traffic. Many NPCs deliberately cross the center so standing still is no longer a free win.
            if (Math.random() < 0.0944) {
                const dir = Math.random() < 0.18 ? -1 : 1;
                const roll = Math.random();
                const type = roll < 0.30 ? 'grab' : roll < 0.52 ? 'banhbao' : roll < 0.73 ? 'local' : 'car';
                const edgeSpawn = Math.random() < 0.35;
                const x = edgeSpawn ? (Math.random() < 0.5 ? 205 : 695) : 220 + Math.random() * (canvas.width - 440);
                const crossCenter = Math.random() < 0.55;
                const targetX = crossCenter
                    ? (x < canvas.width/2 ? 690 + Math.random()*90 : 120 + Math.random()*90)
                    : 250 + Math.random() * (canvas.width - 500);
                lvl4NPCs.push({
                    x,
                    y: dir > 0 ? -70 : canvas.height + 70,
                    speed: 3.0 + Math.random()*2.4, dir, baseDir: dir, type,
                    vx: 0, wobble: Math.random() * Math.PI * 2,
                    targetX,
                    retargetAt: performance.now() + 1100 + Math.random()*1800,
                    brake: false, turned: false
                });
            }

            for (let i = lvl4NPCs.length - 1; i >= 0; i--) {
                let npc = lvl4NPCs[i];
                npc.wobble += 0.04;
                if (performance.now() > npc.retargetAt) {
                    npc.retargetAt = performance.now() + 1300 + Math.random()*2200;
                    if (Math.random() < 0.6) npc.targetX = 180 + Math.random() * (canvas.width - 360);
                }
                npc.x += Math.max(-2.2, Math.min(2.2, (npc.targetX - npc.x) * 0.018));
                if (Math.random() < 0.0035 && !npc.turned) { npc.dir *= -1; npc.turned = true; }
                if (Math.random() < 0.008) npc.brake = !npc.brake;
                const actualSpeed = npc.brake ? npc.speed * 0.32 : npc.speed;
                npc.y += actualSpeed * npc.dir;
                // Keep NPC exhaust visually consistent with Aldon's exhaust.
                if (Math.random() < 0.08 && npc.type !== 'banhbao') spawnParticles(npc.x + 10, npc.y + (npc.dir > 0 ? 35 : -35), '#94a3b8', 1, 0.7, 3.5);
                if (npc.type === 'banhbao' && !npc.voicePlayed && ((npc.dir > 0 && npc.y > 40) || (npc.dir < 0 && npc.y < canvas.height - 40))) {
                    npc.voicePlayed = true;
                    playCustomSfx('banhBao', 'Бань бао! Горячий бань бао!', 1.15);
                }

                if (Math.abs(npc.x - lvl4Scooter.x) < (npc.type === 'car' ? 42 : 32) && Math.abs(npc.y - lvl4Scooter.y) < 58) {
                    hp -= 25; triggerScreenShake(); playCustomSfx('scooterCrash', 'hit');
                    spawnParticles(lvl4Scooter.x, lvl4Scooter.y, '#f59e0b', 20, 5, 5);
                    lvl4NPCs.splice(i, 1);
                    if (hp <= 0) { gameOver('ДТП во Вьетнаме! Байк разбит, Жоник не дождался.', 'lvl4Fail'); return; }
                    continue;
                }
                if (npc.y > canvas.height + 140 || npc.y < -140) lvl4NPCs.splice(i, 1);
            }

            if (lvl4Distance >= LVL4_GOAL) { showVictoryScreen(); return; }

            // Render Tropical Environment
            ctx.fillStyle = '#0ea5e9'; ctx.fillRect(0, 0, canvas.width, canvas.height); // Sea/Sides
            ctx.fillStyle = '#4b5563'; ctx.fillRect(150, 0, canvas.width - 300, canvas.height); // Road
            ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 3;
            ctx.setLineDash([34, 28]); ctx.lineDashOffset = -(lvl4Distance % 62);
            ctx.beginPath(); ctx.moveTo(canvas.width/2, 0); ctx.lineTo(canvas.width/2, canvas.height); ctx.stroke();
            ctx.setLineDash([]);
            ctx.fillStyle = 'rgba(20,20,20,0.35)'; ctx.fillRect(150, 0, 8, canvas.height); ctx.fillRect(canvas.width-158, 0, 8, canvas.height);
            
            // Side elements (Palms & Signs)
            const objOffset = (lvl4Distance * 1.5) % (canvas.height + 200) - 100;
            const objOffset2 = ((lvl4Distance * 1.5) + 300) % (canvas.height + 200) - 100;

            // Palms
            ctx.fillStyle = '#15803d';
            ctx.beginPath(); ctx.arc(75, objOffset, 40, 0, Math.PI*2); ctx.arc(canvas.width - 75, objOffset2, 40, 0, Math.PI*2); ctx.fill();

            // Neon Signs off the road
            ctx.save();
            // Sign 1: Left
            ctx.translate(15, objOffset2);
            ctx.fillStyle = '#ef4444'; ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 15;
            ctx.fillRect(0, 0, 120, 40); ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Arial'; ctx.fillText('BÁNH MÌ', 60, 25);
            ctx.restore();

            ctx.save();
            // Sign 2: Right
            ctx.translate(canvas.width - 135, objOffset);
            ctx.fillStyle = '#eab308'; ctx.shadowColor = '#eab308'; ctx.shadowBlur = 15;
            ctx.fillRect(0, 0, 120, 40); ctx.shadowBlur = 0;
            ctx.fillStyle = '#000'; ctx.font = 'bold 16px Arial'; ctx.fillText('PHỞ BÒ', 60, 25);
            ctx.restore();

            // Draw Entities
            lvl4NPCs.forEach(npc => drawVietnamScooter(ctx, npc.x, npc.y, false, npc.type, npc.dir));
            drawVietnamScooter(ctx, lvl4Scooter.x, lvl4Scooter.y, true, 'player');
            updateAndDrawParticles(ctx);

            animationFrameId = requestAnimationFrame(runLevel4Loop);
        }

        function gameOver(msg, failSound = null) {
            gameState = 'GAMEOVER';
            cancelAnimationFrame(animationFrameId);
            if (lvl3Interval) { clearInterval(lvl3Interval); lvl3Interval = null; }
            stopEngineSound();
            stopAllOneShotAudio();
            stopBGM(true);
            if (failSound) playCustomSfx(failSound);
            hudOverlay.classList.add('hidden');
            showUI(`
                <div class="text-center w-full max-w-md glass-panel p-8 rounded-3xl border border-red-600 neon-border-red">
                    <h2 class="text-3xl font-black text-red-500 mb-4 pixel-font">GAME OVER</h2>
                    <p class="text-sm text-slate-300 mb-8">${msg}</p>
                    <button onclick="showMenu()" class="btn-glow w-full py-4 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl uppercase tracking-widest">В Главное Меню</button>
                </div>
            `);
        }

        function showVictoryScreen() {
            gameState = 'VICTORY'; cancelAnimationFrame(animationFrameId);
            stopEngineSound();
            stopAllOneShotAudio();
            stopBGM(true);
            hudOverlay.classList.add('hidden');
            playCustomSfx('victory');

            showUI(`
                <div class="text-center w-full max-w-xl glass-panel p-6 sm:p-8 rounded-3xl border-2 border-yellow-400 neon-border-yellow overflow-hidden relative">
                    <!-- Confetti effect base -->
                    <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMCIgaGVpZ2h0PSIxMCIgZmlsbD0ieWVsbG93IiBvcGFjaXR5PSIwLjEiLz48L3N2Zz4=')]"></div>
                    
                    <div class="text-6xl mb-4 drop-shadow-xl relative z-10">🥳🎉🇻🇳</div>
                    <h2 class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 mb-2 neon-text-yellow relative z-10">
                        С ДНЕМ РОЖДЕНИЯ, АЛДОН!
                    </h2>
                    <p class="text-lg text-emerald-400 font-bold mb-6 relative z-10">Ты успешно добрался во Вьетнам к Жонику!</p>
                    
                    <div class="bg-slate-900/80 p-5 rounded-2xl border border-slate-700 text-left mb-8 space-y-3 text-sm text-slate-200 relative z-10 shadow-inner">
                        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                            <span class="font-bold">Финальный счет:</span>
                            <span class="text-2xl font-black text-yellow-400 pixel-font">${score}</span>
                        </div>
                        <p class="flex items-center gap-2"><span>✅</span> Ралли Альметьевск — Казань пройдено!</p>
                        <p class="flex items-center gap-2"><span>✅</span> Майор Петренко остался с носом!</p>
                        <p class="flex items-center gap-2"><span>✅</span> Базар Алматы опустошен!</p>
                        <p class="flex items-center gap-2"><span>✅</span> Трафик Нячанга побежден!</p>
                    </div>

                    <button onclick="showMenu()" class="btn-glow relative z-10 w-full py-4 bg-gradient-to-r from-yellow-500 to-orange-500 text-slate-900 font-extrabold text-base rounded-xl shadow-lg uppercase tracking-wider">
                        Играть Еще Раз 🎮
                    </button>
                </div>
            `);
        }

        ['pointerdown', 'touchstart', 'keydown'].forEach(evt => {
            window.addEventListener(evt, primeAudioFromUserGesture, { passive: true });
        });

        // The browser cannot autoplay audible MP3s before any user gesture.
        // The very first gesture therefore starts the menu track while the menu is still visible.
        window.addEventListener('pointerdown', () => {
            if (gameState === 'MENU' && (!currentBGM || currentBGM.paused)) playBGM('menu');
        }, { passive: true });

        window.addEventListener('load', () => {
            showMenu();
            if ('speechSynthesis' in window && window.speechSynthesis.onvoiceschanged !== undefined) {
                window.speechSynthesis.onvoiceschanged = () => {};
            }
        });
    </script>
</body>
</html>
