<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Алдон: Путь в Нячанг (Birthday Quest)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Rubik:wght@400;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --neon-blue: #3b82f6;
            --neon-red: #ef4444;
            --neon-green: #10b981;
            --neon-yellow: #f59e0b;
        }
        body {
            font-family: 'Rubik', sans-serif;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            color: #f8fafc;
            overflow-x: hidden;
            user-select: none;
            touch-action: manipulation;
        }
        .pixel-font { font-family: 'Press Start 2P', monospace; }
        
        /* Glassmorphism & Neon Effects */
        .glass-panel {
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .neon-border-blue { box-shadow: 0 0 10px var(--neon-blue), inset 0 0 10px rgba(59, 130, 246, 0.2); border-color: var(--neon-blue); }
        .neon-border-red { box-shadow: 0 0 10px var(--neon-red), inset 0 0 10px rgba(239, 68, 68, 0.2); border-color: var(--neon-red); }
        .neon-text-yellow { text-shadow: 0 0 8px rgba(245, 158, 11, 0.8); }
        
        /* Animations */
        @keyframes shake {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            20% { transform: translate(-3px, 2px) rotate(-1deg); }
            40% { transform: translate(3px, -2px) rotate(1deg); }
            60% { transform: translate(-3px, -2px) rotate(-1deg); }
            80% { transform: translate(3px, 2px) rotate(1deg); }
        }
        .shaking { animation: shake 0.3s ease-in-out; }
        
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 15px rgba(245, 158, 11, 0.4); }
            50% { box-shadow: 0 0 30px rgba(245, 158, 11, 0.8); }
        }
        .btn-glow:hover { animation: pulse-glow 1.5s infinite; }

        /* Speech Bubble Arrow */
        .speech-bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 20px;
            border-width: 10px 10px 0;
            border-style: solid;
            border-color: rgba(30, 41, 59, 0.95) transparent;
            display: block;
            width: 0;
        }

        /* Responsive Canvas Container */
        #gameWrapper {
            width: 100%;
            max-width: 900px;
            aspect-ratio: 16 / 10;
            position: relative;
        }
        canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 1rem;
        }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #3b82f6; border-radius: 4px; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-2 sm:p-4">

    <!-- Header -->
    <header class="w-full max-w-[900px] flex justify-between items-center mb-4 glass-panel p-3 sm:p-4 rounded-xl z-40">
        <div class="flex items-center space-x-3">
            <div class="bg-gradient-to-br from-yellow-400 to-orange-500 p-2 rounded-lg shadow-lg">
                <span class="text-xl sm:text-2xl drop-shadow-md">🎂</span>
            </div>
            <h1 class="font-black text-[10px] sm:text-sm text-yellow-400 pixel-font neon-text-yellow leading-tight">АЛДОН:<br>ПУТЬ В НЯЧАНГ</h1>
        </div>
        <button id="soundToggleBtn" onclick="toggleAudio()" class="px-4 py-2 bg-slate-800/80 hover:bg-slate-700 rounded-lg flex items-center gap-2 border border-slate-600 shadow-md transition-all">
            <span id="soundIcon" class="text-lg">🔊</span> <span id="soundText" class="text-xs sm:text-sm font-bold">ВКЛ</span>
        </button>
    </header>

    <!-- Game Wrapper -->
    <main id="gameWrapper" class="glass-panel rounded-2xl shadow-[0_0_40px_rgba(0,0,0,0.5)] border-2 border-slate-700/50 overflow-hidden flex flex-col">
        
        <!-- HUD Overlay -->
        <div id="hudOverlay" class="hidden absolute top-0 left-0 right-0 z-20 flex justify-between items-start p-3 sm:p-4 pointer-events-none">
            <div class="flex flex-col gap-2">
                <div class="glass-panel px-3 py-1.5 rounded-lg border-l-4 border-l-blue-500">
                    <span id="hudLevelName" class="font-bold text-white text-xs sm:text-sm tracking-wide">Уровень 1</span>
                </div>
                <div class="glass-panel px-3 py-1.5 rounded-lg border-l-4 border-l-yellow-400 flex items-center gap-2">
                    <span class="text-[10px] text-slate-300 uppercase">Очки</span>
                    <span id="hudScore" class="font-bold text-yellow-400 text-sm sm:text-base pixel-font neon-text-yellow">0</span>
                </div>
            </div>
            
            <div id="hpContainer" class="glass-panel px-3 py-2 rounded-lg border-l-4 border-l-green-500 flex flex-col gap-1 items-end min-w-[120px]">
                <span class="text-[10px] text-slate-300 uppercase font-bold">Здоровье</span>
                <div class="w-full bg-slate-900 h-3 rounded-full overflow-hidden shadow-inner border border-slate-700">
                    <div id="hpBar" class="bg-gradient-to-r from-emerald-400 to-emerald-500 h-full w-full transition-all duration-300 ease-out shadow-[0_0_10px_rgba(16,185,129,0.8)]"></div>
                </div>
            </div>
        </div>

        <!-- The Canvas -->
        <canvas id="gameCanvas" width="900" height="562"></canvas>

        <!-- UI Screen Overlay -->
        <div id="uiOverlay" class="absolute inset-0 z-30 flex flex-col items-center justify-center p-4 sm:p-6 bg-slate-950/80 backdrop-blur-sm transition-opacity duration-300">
            <!-- Screen content injected via JS -->
        </div>
    </main>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const uiOverlay = document.getElementById('uiOverlay');
        const hudOverlay = document.getElementById('hudOverlay');
        const hpContainer = document.getElementById('hpContainer');

        // Assets placeholder
        const GAME_ASSETS = { audio: {}, images: {} };

        // Audio System
        let soundEnabled = true;
        let audioContext = null;

        function initAudioContext() {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') audioContext.resume();
        }

        function toggleAudio() {
            soundEnabled = !soundEnabled;
            document.getElementById('soundIcon').innerText = soundEnabled ? '🔊' : '🔇';
            document.getElementById('soundText').innerText = soundEnabled ? 'ВКЛ' : 'ВЫКЛ';
        }

        function playSynthSound(type) {
            if (!soundEnabled) return;
            initAudioContext();
            try {
                const ctx = audioContext;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                const now = ctx.currentTime;

                if (type === 'hit') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, now);
                    osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
                    gain.gain.setValueAtTime(0.4, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                } else if (type === 'eat') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.1);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                } else if (type === 'denied') {
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(100, now);
                    osc.frequency.setValueAtTime(70, now + 0.2);
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.5);
                    osc.start(now); osc.stop(now + 0.5);
                } else if (type === 'win') {
                    osc.type = 'triangle';
                    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                        osc.frequency.setValueAtTime(freq, now + i*0.15);
                    });
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.8);
                    osc.start(now); osc.stop(now + 0.8);
                }
            } catch(e) {}
        }

        let gameState = 'MENU'; 
        let score = 0;
        let hp = 100;
        let animationFrameId = null;

        function showUI(html, backdrop = true) {
            uiOverlay.innerHTML = html;
            uiOverlay.classList.remove('hidden', 'opacity-0', 'pointer-events-none');
            uiOverlay.className = `absolute inset-0 z-30 flex flex-col items-center justify-center p-4 sm:p-6 transition-all duration-300 ${backdrop ? 'bg-slate-950/85 backdrop-blur-md pointer-events-auto' : 'pointer-events-none'}`;
        }

        function hideUI() {
            uiOverlay.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => { if(uiOverlay.classList.contains('opacity-0')) uiOverlay.innerHTML = ''; }, 300);
        }

        // Particle System
        let particles = [];
        function spawnParticles(x, y, color, count, speed = 2, size = 4) {
            for(let i=0; i<count; i++) {
                particles.push({
                    x: x, y: y,
                    vx: (Math.random() - 0.5) * speed * 2,
                    vy: (Math.random() - 0.5) * speed * 2,
                    life: 1.0, color: color, size: size + Math.random()*2
                });
            }
        }
        function updateAndDrawParticles(c) {
            for(let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx; p.y += p.vy;
                p.life -= 0.02;
                if(p.life <= 0) { particles.splice(i, 1); continue; }
                c.globalAlpha = p.life;
                c.fillStyle = p.color;
                c.beginPath(); c.arc(p.x, p.y, p.size, 0, Math.PI*2); c.fill();
            }
            c.globalAlpha = 1.0;
        }

        // Input
        const keys = { Left: false, Right: false };
        window.addEventListener('keydown', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = true;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = true;
        });
        window.addEventListener('keyup', e => {
            if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = false;
            if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = false;
        });
        // Touch Controls
        canvas.addEventListener('touchstart', handleTouch, {passive: false});
        canvas.addEventListener('touchmove', handleTouch, {passive: false});
        canvas.addEventListener('touchend', () => { keys.Left = false; keys.Right = false; });
        function handleTouch(e) {
            e.preventDefault();
            const touchX = e.touches[0].clientX;
            const screenW = window.innerWidth;
            if (touchX < screenW / 2) { keys.Left = true; keys.Right = false; } 
            else { keys.Right = true; keys.Left = false; }
        }

        function updateHUD(levelName, showHP = true) {
            document.getElementById('hudScore').innerText = score;
            document.getElementById('hudLevelName').innerText = levelName;
            
            if (showHP) {
                hpContainer.style.display = 'flex';
                const hpBar = document.getElementById('hpBar');
                hpBar.style.width = `${Math.max(0, hp)}%`;
                
                // Color based on HP
                if (hp < 30) hpBar.className = "bg-gradient-to-r from-red-500 to-red-600 h-full w-full transition-all shadow-[0_0_15px_rgba(239,68,68,0.9)]";
                else if (hp < 60) hpBar.className = "bg-gradient-to-r from-yellow-400 to-yellow-500 h-full w-full transition-all shadow-[0_0_15px_rgba(245,158,11,0.9)]";
                else hpBar.className = "bg-gradient-to-r from-emerald-400 to-emerald-500 h-full w-full transition-all shadow-[0_0_15px_rgba(16,185,129,0.9)]";
            } else {
                hpContainer.style.display = 'none';
            }
        }

        function triggerScreenShake() {
            const container = document.getElementById('gameWrapper');
            container.classList.add('shaking');
            setTimeout(() => container.classList.remove('shaking'), 300);
        }

        function drawLadaKalina(c, x, y, width = 70, height = 120) {
            c.save(); c.translate(x, y);
            
            // Drop shadow
            c.fillStyle = 'rgba(0,0,0,0.5)';
            c.beginPath(); c.ellipse(5, 5, width/1.6, height/1.8, 0, 0, Math.PI*2); c.fill();

            // Wheels
            c.fillStyle = '#0f172a';
            c.fillRect(-width/2 - 6, -height/2 + 15, 10, 24);
            c.fillRect(width/2 - 4, -height/2 + 15, 10, 24);
            c.fillRect(-width/2 - 6, height/2 - 35, 10, 24);
            c.fillRect(width/2 - 4, height/2 - 35, 10, 24);

            // Car Body (Maroon)
            const gradient = c.createLinearGradient(-width/2, 0, width/2, 0);
            gradient.addColorStop(0, '#500014');
            gradient.addColorStop(0.5, '#990026');
            gradient.addColorStop(1, '#500014');
            c.fillStyle = gradient;
            c.beginPath(); c.roundRect(-width/2, -height/2, width, height, 16); c.fill();

            // Windshield (Transparent showing inside)
            c.fillStyle = '#1e293b'; // Interior dark
            c.beginPath(); c.roundRect(-width/2 + 6, -height/2 + 30, width - 12, 35, 6); c.fill();
            
            // Driver (Aldon - dark hair)
            c.fillStyle = '#1e1b18'; // Dark hair
            c.beginPath(); c.arc(-15, -height/2 + 45, 12, 0, Math.PI*2); c.fill();
            // Shoulders (Blue shirt)
            c.fillStyle = '#2563eb';
            c.fillRect(-25, -height/2 + 55, 20, 10);

            // Passenger (Ilya - bald shine)
            c.fillStyle = '#f5c89c'; // Skin
            c.beginPath(); c.arc(15, -height/2 + 45, 13, 0, Math.PI*2); c.fill();
            // Shine on bald head
            c.fillStyle = 'rgba(255,255,255,0.7)';
            c.beginPath(); c.ellipse(10, -height/2 + 40, 5, 2, -Math.PI/6, 0, Math.PI*2); c.fill();
            // Shoulders (Red tank top)
            c.fillStyle = '#dc2626';
            c.fillRect(5, -height/2 + 55, 20, 10);

            // Windshield Gloss reflection
            c.fillStyle = 'rgba(255, 255, 255, 0.15)';
            c.beginPath(); c.moveTo(-width/2 + 6, -height/2 + 30);
            c.lineTo(width/2 - 6, -height/2 + 30); c.lineTo(width/2 - 20, -height/2 + 65); c.lineTo(-width/2 + 6, -height/2 + 45); c.fill();

            // Rear Window
            c.fillStyle = '#38bdf8'; c.globalAlpha = 0.8;
            c.fillRect(-width/2 + 10, height/2 - 25, width - 20, 15); c.globalAlpha = 1.0;

            // Roof Rack & Luggage
            c.fillStyle = '#334155'; c.fillRect(-width/2 + 8, -height/2 + 70, width - 16, 20);
            c.fillStyle = '#854d0e'; c.fillRect(-15, -height/2 + 68, 30, 24); // Brown bag

            // Headlights
            c.fillStyle = '#fef08a';
            c.shadowColor = '#fef08a'; c.shadowBlur = 15;
            c.beginPath(); c.roundRect(-width/2 + 4, -height/2 + 2, 14, 8, 3); c.fill();
            c.beginPath(); c.roundRect(width/2 - 18, -height/2 + 2, 14, 8, 3); c.fill();
            c.shadowBlur = 0; // reset
            c.restore();
        }

        function drawMajorPetrenko(c, x, y) {
            c.save(); c.translate(x, y);
            
            // Shoulders / Uniform
            c.fillStyle = '#1e3a8a';
            c.beginPath(); c.roundRect(-100, 50, 200, 150, [40, 40, 0, 0]); c.fill();
            
            // Epaulets (Gold)
            c.fillStyle = '#eab308';
            c.fillRect(-95, 55, 40, 15);
            c.fillRect(55, 55, 40, 15);
            
            // Tie & Shirt
            c.fillStyle = '#93c5fd'; c.beginPath(); c.moveTo(0, 50); c.lineTo(-20, 100); c.lineTo(20, 100); c.fill();
            c.fillStyle = '#111'; c.beginPath(); c.moveTo(0, 70); c.lineTo(-10, 150); c.lineTo(10, 150); c.fill();

            // Fat Face
            c.fillStyle = '#fca5a5';
            c.beginPath(); c.ellipse(0, 0, 50, 60, 0, 0, Math.PI*2); c.fill();
            // Double chin
            c.beginPath(); c.ellipse(0, 45, 40, 20, 0, 0, Math.PI*2); c.fill();

            // Angry Eyes
            c.lineWidth = 4; c.strokeStyle = '#450a0a';
            c.beginPath(); c.moveTo(-35, -15); c.lineTo(-10, -5); c.stroke();
            c.beginPath(); c.moveTo(35, -15); c.lineTo(10, -5); c.stroke();
            c.fillStyle = '#fff'; c.beginPath(); c.arc(-20, 0, 8, 0, Math.PI*2); c.arc(20, 0, 8, 0, Math.PI*2); c.fill();
            c.fillStyle = '#000'; c.beginPath(); c.arc(-20, 0, 3, 0, Math.PI*2); c.arc(20, 0, 3, 0, Math.PI*2); c.fill();

            // Mustache
            c.fillStyle = '#450a0a';
            c.beginPath(); c.ellipse(0, 25, 25, 10, 0, 0, Math.PI); c.fill();

            // Cap (Фуражка)
            c.fillStyle = '#1e3a8a';
            c.beginPath(); c.ellipse(0, -50, 55, 30, 0, Math.PI, 0); c.fill(); // Crown
            c.fillStyle = '#dc2626'; c.fillRect(-55, -50, 110, 10); // Red band
            c.fillStyle = '#111'; c.beginPath(); c.ellipse(0, -40, 60, 15, 0, 0, Math.PI); c.fill(); // Visor
            // Gold Star
            c.fillStyle = '#eab308';
            c.font = '20px Arial'; c.textAlign = 'center'; c.textBaseline = 'middle';
            c.fillText('★', 0, -45);

            c.restore();
        }

        function showMenu() {
            gameState = 'MENU';
            hudOverlay.classList.add('hidden');

            showUI(`
                <div class="text-center w-full max-w-lg glass-panel p-6 sm:p-8 rounded-3xl border border-blue-500/30 neon-border-blue relative overflow-hidden">
                    <div class="absolute -top-10 -right-10 w-32 h-32 bg-blue-500/20 rounded-full blur-3xl"></div>
                    <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-red-500/20 rounded-full blur-3xl"></div>
                    
                    <h2 class="text-2xl sm:text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 via-yellow-500 to-orange-500 mb-4 neon-text-yellow drop-shadow-md">
                        ВЬЕТНАМСКИЙ ДРИФТ
                    </h2>
                    
                    <p class="text-sm text-slate-200 mb-8 font-medium leading-relaxed drop-shadow">
                        Пройди путь от Альметьевска до Нячанга! Уклоняйся от дронов, обмани майора на границе, поймай кумыс и выживи во вьетнамском трафике, чтобы поздравить Жоника!
                    </p>

                    <button onclick="startLevel1()" class="btn-glow w-full py-4 sm:py-5 bg-gradient-to-r from-blue-600 to-blue-500 hover:from-blue-500 hover:to-blue-400 text-white font-extrabold text-sm sm:text-base rounded-2xl shadow-[0_0_20px_rgba(59,130,246,0.6)] transform hover:-translate-y-1 transition-all duration-200 pixel-font tracking-wide uppercase">
                        Начать Квест 🚀
                    </button>

                    <div class="mt-6 flex justify-center gap-4 text-xs font-bold text-slate-400 uppercase tracking-wider">
                        <span>Стрелки Влево/Вправо</span> <span class="text-slate-600">•</span> <span>Тапы на экране</span>
                    </div>
                </div>
            `);
        }

        let lvl1Player = { x: 450, y: 440, speed: 7 };
        let lvl1Obstacles = [];
        let lvl1Items = [];
        let lvl1Distance = 0;
        const LVL1_GOAL = 3500;

        function startLevel1() {
            gameState = 'LVL1';
            score = 0; hp = 100; lvl1Distance = 0;
            lvl1Player.x = canvas.width / 2;
            lvl1Obstacles = []; lvl1Items = []; particles = [];

            hideUI();
            hudOverlay.classList.remove('hidden');
            cancelAnimationFrame(animationFrameId);
            runLevel1Loop();
        }

        function runLevel1Loop() {
            if (gameState !== 'LVL1') return;
            lvl1Distance += 4;
            updateHUD('1. Трасса М-7', true);
            
            // Exhaust
            if (Math.random() < 0.7) spawnParticles(lvl1Player.x - 10, lvl1Player.y + 60, '#64748b', 1, 1, 5);

            // Movement
            if (keys.Left && lvl1Player.x > 200) lvl1Player.x -= lvl1Player.speed;
            if (keys.Right && lvl1Player.x < canvas.width - 200) lvl1Player.x += lvl1Player.speed;

            // Spawn Obstacles (Trucks & Drones)
            if (Math.random() < 0.05) {
                const type = Math.random() < 0.6 ? 'truck' : 'drone';
                lvl1Obstacles.push({
                    x: 220 + Math.random() * (canvas.width - 440),
                    y: -100, type: type, speed: type === 'drone' ? 8 : 2 + Math.random() * 2
                });
            }

            // Spawn Gas Canisters (A95)
            if (Math.random() < 0.02) {
                lvl1Items.push({ x: 220 + Math.random() * (canvas.width - 440), y: -50, speed: 4 });
            }

            // Process Obstacles
            for (let i = lvl1Obstacles.length - 1; i >= 0; i--) {
                let ob = lvl1Obstacles[i];
                ob.y += ob.speed;
                
                // Truck Smoke
                if (ob.type === 'truck' && Math.random() < 0.8) spawnParticles(ob.x, ob.y + 40, '#1e293b', 2, 2, 8);

                let hitW = ob.type === 'truck' ? 50 : 60; // wider hitbox for wings
                let hitH = ob.type === 'truck' ? 100 : 30;

                if (Math.abs(ob.x - lvl1Player.x) < (hitW/2 + 35) && Math.abs(ob.y - lvl1Player.y) < (hitH/2 + 60)) {
                    hp -= (ob.type === 'truck' ? 25 : 35);
                    triggerScreenShake(); playSynthSound('hit');
                    spawnParticles(lvl1Player.x, lvl1Player.y - 40, '#ef4444', 25, 5, 6);
                    lvl1Obstacles.splice(i, 1);
                    if (hp <= 0) { gameOver('Калина разбита! Авиабилеты сгорели.'); return; }
                    continue;
                }
                if (ob.y > canvas.height + 150) lvl1Obstacles.splice(i, 1);
            }

            // Process Items
            for (let i = lvl1Items.length - 1; i >= 0; i--) {
                let it = lvl1Items[i];
                it.y += it.speed;
                if (Math.abs(it.x - lvl1Player.x) < 40 && Math.abs(it.y - lvl1Player.y) < 60) {
                    score += 200;
                    hp = Math.min(100, hp + 10);

                    spawnParticles(lvl4Scooter.x, lvl4Scooter.y, '#f59e0b', 20, 5, 5);
                    lvl4NPCs.splice(i, 1);
                    if (hp <= 0) { gameOver('ДТП во Вьетнаме! Байк разбит, Жоник не дождался.'); return; }
                    continue;
                }
                if (npc.y > canvas.height + 100) lvl4NPCs.splice(i, 1);
            }

            if (lvl4Distance >= LVL4_GOAL) { showVictoryScreen(); return; }

            // Render Tropical Environment
            ctx.fillStyle = '#0ea5e9'; ctx.fillRect(0, 0, canvas.width, canvas.height); // Sea/Sides
            ctx.fillStyle = '#475569'; ctx.fillRect(150, 0, canvas.width - 300, canvas.height); // Road
            
            // Side elements (Palms & Signs)
            const objOffset = (lvl4Distance * 1.5) % (canvas.height + 200) - 100;
            const objOffset2 = ((lvl4Distance * 1.5) + 300) % (canvas.height + 200) - 100;

            // Palms
            ctx.fillStyle = '#15803d';
            ctx.beginPath(); ctx.arc(75, objOffset, 40, 0, Math.PI*2); ctx.arc(canvas.width - 75, objOffset2, 40, 0, Math.PI*2); ctx.fill();

            // Neon Signs off the road
            ctx.save();
            // Sign 1: Left
            ctx.translate(15, objOffset2);
            ctx.fillStyle = '#ef4444'; ctx.shadowColor = '#ef4444'; ctx.shadowBlur = 15;
            ctx.fillRect(0, 0, 120, 40); ctx.shadowBlur = 0;
            ctx.fillStyle = '#fff'; ctx.font = 'bold 16px Arial'; ctx.fillText('BÁNH MÌ', 60, 25);
            ctx.restore();

            ctx.save();
            // Sign 2: Right
            ctx.translate(canvas.width - 135, objOffset);
            ctx.fillStyle = '#eab308'; ctx.shadowColor = '#eab308'; ctx.shadowBlur = 15;
            ctx.fillRect(0, 0, 120, 40); ctx.shadowBlur = 0;
            ctx.fillStyle = '#000'; ctx.font = 'bold 16px Arial'; ctx.fillText('PHỞ BÒ', 60, 25);
            ctx.restore();

            // Draw Entities
            lvl4NPCs.forEach(npc => drawVietnamScooter(ctx, npc.x, npc.y, false, npc.type));
            drawVietnamScooter(ctx, lvl4Scooter.x, lvl4Scooter.y, true, 'player');
            updateAndDrawParticles(ctx);

            animationFrameId = requestAnimationFrame(runLevel4Loop);
        }

        function gameOver(msg) {
            cancelAnimationFrame(animationFrameId);
            hudOverlay.classList.add('hidden');
            showUI(`
                <div class="text-center w-full max-w-md glass-panel p-8 rounded-3xl border border-red-600 neon-border-red">
                    <h2 class="text-3xl font-black text-red-500 mb-4 pixel-font">GAME OVER</h2>
                    <p class="text-sm text-slate-300 mb-8">${msg}</p>
                    <button onclick="showMenu()" class="btn-glow w-full py-4 bg-red-600 hover:bg-red-500 text-white font-bold rounded-xl uppercase tracking-widest">В Главное Меню</button>
                </div>
            `);
        }

        function showVictoryScreen() {
            gameState = 'VICTORY'; cancelAnimationFrame(animationFrameId);
            hudOverlay.classList.add('hidden');
            playSynthSound('win');

            showUI(`
                <div class="text-center w-full max-w-xl glass-panel p-8 rounded-3xl border-2 border-yellow-400 neon-border-yellow overflow-hidden relative">
                    <!-- Confetti effect base -->
                    <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSIxMDAlIiBoZWlnaHQ9IjEwMCUiPjxyZWN0IHdpZHRoPSIxMCIgaGVpZ2h0PSIxMCIgZmlsbD0ieWVsbG93IiBvcGFjaXR5PSIwLjEiLz48L3N2Zz4=')]"></div>
                    
                    <div class="text-6xl mb-4 drop-shadow-xl relative z-10">🥳🎉🇻🇳</div>
                    <h2 class="text-3xl sm:text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-yellow-300 to-yellow-600 mb-2 neon-text-yellow relative z-10">
                        С ДНЕМ РОЖДЕНИЯ, АЛДОН!
                    </h2>
                    <p class="text-lg text-emerald-400 font-bold mb-6 relative z-10">Ты успешно добрался во Вьетнам к Жонику!</p>
                    
                    <div class="bg-slate-900/80 p-5 rounded-2xl border border-slate-700 text-left mb-8 space-y-3 text-sm text-slate-200 relative z-10 shadow-inner">
                        <div class="flex justify-between items-center border-b border-slate-700 pb-2">
                            <span class="font-bold">Финальный счет:</span>
                            <span class="text-2xl font-black text-yellow-400 pixel-font">${score}</span>
                        </div>
                        <p class="flex items-center gap-2"><span>✅</span> Ралли Альметьевск — Казань пройдено!</p>
                        <p class="flex items-center gap-2"><span>✅</span> Майор Петренко остался с носом!</p>
                        <p class="flex items-center gap-2"><span>✅</span> Базар Алматы опустошен!</p>
                        <p class="flex items-center gap-2"><span>✅</span> Трафик Нячанга побежден!</p>
                    </div>

                    <button onclick="showMenu()" class="btn-glow relative z-10 w-full py-4 bg-gradient-to-r from-yellow-500 to-orange-500 text-slate-900 font-extrabold text-base rounded-xl shadow-lg uppercase tracking-wider">
                        Играть Еще Раз 🎮
                    </button>
                </div>
            `);
        }

        window.onload = showMenu;
    </script>
</body>
</html>
